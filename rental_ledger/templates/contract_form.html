{% extends "base.html" %}
{% block title %}지난 계약 {{ '수정' if contract_id else '입력' }} - {{ unit.name }}{% endblock %}
{% block content %}
<h1>{{ unit.name }} 지난 계약 {{ '수정' if contract_id else '입력' }}</h1>

<form method="post" class="panel form">
  <div class="grid">
    <label>임차인 *<input name="tenant" required value="{{ contract.tenant if contract else '' }}"></label>
    <label>연락처<input name="phone" value="{{ contract.phone if contract else '' }}"></label>
    <label>계약 형태
      <select name="contract_type">
        {% for c in contract_types %}<option {{ 'selected' if contract and contract.contract_type == c }}>{{ c }}</option>{% endfor %}
      </select>
    </label>
    <label>보증금 (원)<input name="deposit" inputmode="numeric" value="{{ contract.deposit if contract else 0 }}"></label>
    <label>월세 (원)<input name="monthly_rent" inputmode="numeric" value="{{ contract.monthly_rent if contract else 0 }}"></label>
    <label>관리비 (원)<input name="maintenance" inputmode="numeric" value="{{ contract.maintenance if contract else 0 }}"></label>
    <label>입주일<input type="date" name="start_date" value="{{ contract.start_date if contract else '' }}"></label>
    <label>퇴거일 *<input type="date" name="end_date" required value="{{ contract.end_date if contract else '' }}"></label>
  </div>
  <label>메모<textarea name="memo" rows="2">{{ contract.memo if contract else '' }}</textarea></label>
  <div class="form-actions">
    <button class="btn primary" type="submit">저장</button>
    <a class="btn" href="{{ url_for('unit_detail', unit_id=unit.id) }}">취소</a>
  </div>
</form>

{% if contract_id %}
<form method="post" action="{{ url_for('contract_delete', contract_id=contract_id) }}" onsubmit="return confirm('이 지난 계약을 삭제할까요? (입출금 기록은 남습니다)');">
  <button class="btn danger" type="submit">지난 계약 삭제</button>
</form>
{% endif %}
{% endblock %}
